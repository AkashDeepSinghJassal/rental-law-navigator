[project]
name = "navigator"
version = "0.1.0"
description = "Rental Housing Law Navigator: address-level housing rules with verified citations. Not legal advice."
authors = [
    { name = "AkashDeepSinghJassal", email = "akashdeepjassal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
